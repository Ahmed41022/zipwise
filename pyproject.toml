[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zipwise"
version = "0.1.0"
description = "A free file archiver for Windows and Linux: ZIP, 7z, TAR, RAR (read) with a safety-first extractor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Ragab" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "pyzipper",
    "py7zr>=1.0,<2",
    "zstandard",
    "rarfile",
]

[project.optional-dependencies]
# PySide6 6.12.0 on Linux gets reference counts wrong under Python 3.11 and aborts the
# interpreter; 3.12+ is immune because True, False and None are immortal there.
gui = [
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
]
# Needed only to open RAR archives whose file names are encrypted (rarfile asks for it).
rar = ["cryptography"]
dev = ["pytest", "pytest-qt", "ruff", "mypy", "cryptography"]

[project.scripts]
zipwise = "zipwise.cli.main:main"

[project.gui-scripts]
zipwise-gui = "zipwise.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zipwise"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["zipwise"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/zipwise"]

[[tool.mypy.overrides]]
module = "zipwise.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that take noticeably longer than the rest",
    "gui: tests that need PySide6 and an offscreen Qt platform",
    "needs_symlink: tests that need permission to create symlinks",
    "needs_unrar: tests that need an external unrar-compatible tool",
    "needs_7zip: interop tests that need the real 7-Zip (7z, 7zz or 7za)",
    "needs_rar: interop tests that need the rar program, to create RAR archives (local only)",
]
