name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Only fetch what the runner image lacks, so a mirror outage does not fail the
          # job when everything is already installed.
          missing=()
          for pkg in libegl1 libxkbcommon0 libgl1 libdbus-1-3 libfontconfig1 libxcb-cursor0; do
            dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed" \
              || missing+=("$pkg")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All Qt system libraries are already installed."
            exit 0
          fi
          echo "Installing: ${missing[*]}"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${missing[@]}"

      - name: Install Zipwise with development and GUI extras
        run: python -m pip install -e ".[dev,gui]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy src/zipwise

      - name: Run the tests
        run: pytest -q
